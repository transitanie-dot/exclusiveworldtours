<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operators — Exclusive World Tours</title>
<meta name="description" content="Operator area of Exclusive World Tours.">
<meta name="robots" content="noindex, nofollow">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fontes/archivo-latin-600-normal.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fontes/inter-latin-400-normal.woff2">
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;
  src:url(/assets/fontes/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;
  src:url(/assets/fontes/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;
  src:url(/assets/fontes/inter-latin-600-normal.woff2) format('woff2')}
/* A 700 entrou quando o portal passou a usar uma familia so: os titulos
   que eram Archivo 700 passam a ser Inter 700. O ficheiro ja estava
   servido do nosso dominio, so nao estava declarado. */
@font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;
  src:url(/assets/fontes/inter-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-style:normal;font-weight:600;font-display:swap;
  src:url(/assets/fontes/archivo-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-style:normal;font-weight:700;font-display:swap;
  src:url(/assets/fontes/archivo-latin-700-normal.woff2) format('woff2')}


:root{
  --tinta:#0B2B2A; --cor:#CE7030; --cor-escura:#A85426;
  --papel:#F6F4F1; --branco:#FFFFFF;
  --tinta-f:#B0B8B5; --cor-f:#E1AF8D; --uma-f:#B9C0BD;
  --texto:#354F4E; --mudo:#5B6F6E; --risco:#D5D8D5;
  /* o ambar sobre fundo escuro: o normal da 4.30:1 e texto pequeno
     precisa de 4.5. Este da 5.24:1 e le-se como a mesma cor. */
  --cor-clara:#D5854F;
  --tipo:'Inter',system-ui,-apple-system,sans-serif;
  --tipo-titulo:'Archivo','Inter',system-ui,sans-serif;
  --mono:ui-monospace,'SFMono-Regular','Menlo','Consolas',monospace;
  --raio:10px;
  /* a escala de intervalos: tudo no site sai daqui */
  --e1:6px; --e2:12px; --e3:20px; --e4:32px; --e5:52px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms !important;
    transition-duration:.01ms !important}}
body{margin:0;background:var(--papel);color:var(--texto);
  font-family:var(--tipo);font-size:15.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--tipo-titulo);color:var(--tinta);
  letter-spacing:-.025em;line-height:1.08;margin:0}
.folha{max-width:1320px;margin:0 auto;padding:0 clamp(16px,2.4vw,32px)}
/* o botao e o foco visivel sao de todas as paginas. Estiveram no CSS da
   homepage e a pagina de resultados ficou com um botao cinzento do
   browser — duas paginas, dois CSS, e a diferenca so se ve a olho. */
.botao{display:inline-flex;align-items:center;justify-content:center;
  background:var(--tinta);color:var(--branco);border:0;border-radius:10px;
  padding:0 26px;min-height:54px;font:inherit;font-weight:600;font-size:16px;
  cursor:pointer;text-decoration:none;white-space:nowrap}
.botao:hover{background:var(--cor-escura)}
a:focus-visible,button:focus-visible,input:focus-visible,
select:focus-visible{outline:3px solid var(--cor);outline-offset:3px;
  border-radius:4px}
/* So aparece a quem navega por teclado — mas aparece mesmo, que e o
   ponto. Escondido com left:-9999px e sem regra de foco, este atalho
   existe no HTML e nao serve a ninguem. */
.saltar{position:absolute;left:16px;top:-60px;z-index:60;background:var(--tinta);
  color:var(--branco);padding:12px 18px;border-radius:0 0 10px 10px;
  text-decoration:none;font-weight:600;transition:top .15s ease}
.saltar:focus{top:0}

/* ------------------------------------------------------------ cabecalho */
.topo{position:sticky;top:0;z-index:40;background:rgba(246,244,241,.94);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--risco)}
.topo-i{display:flex;align-items:center;gap:var(--e3);height:62px}
.topo .marca{color:var(--tinta);flex:none}

.nav{display:flex;align-items:center;gap:4px;margin-left:var(--e2);
  font-size:14.5px;font-weight:500}
.nav > a,.nav-b{display:inline-flex;align-items:center;gap:6px;
  padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--texto);
  background:transparent;border:0;font:inherit;font-weight:500;cursor:pointer}
.nav > a:hover,.nav-b:hover{background:var(--branco);color:var(--tinta)}
.nav-b svg{width:11px;height:8px;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;transition:transform .18s}
.nav-b[aria-expanded="true"] svg{transform:rotate(180deg)}
.nav-b[aria-expanded="true"]{background:var(--branco);color:var(--tinta)}

/* a gaveta dos destinos */
.nav-d{position:relative}
.men{position:absolute;left:0;top:calc(100% + 10px);z-index:50;width:400px;
  background:var(--branco);border:1px solid var(--risco);
  border-radius:var(--raio);padding:14px;
  box-shadow:0 26px 54px -28px rgba(11,43,42,.45)}
.men[hidden]{display:none}
.men-t{margin:0 0 10px;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mudo);font-weight:600}
.men-g{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.men-g a{display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:9px 11px;border-radius:7px;text-decoration:none;
  color:var(--tinta);font-size:14.5px}
.men-g a:hover{background:var(--papel)}
.men-n{font-family:var(--mono);font-size:11.5px;color:var(--mudo)}
.men-todos{display:block;margin-top:10px;padding:10px 11px;border-radius:7px;
  background:var(--papel);text-decoration:none;color:var(--cor-escura);
  font-weight:600;font-size:14px}
.men-todos:hover{background:var(--tinta);color:var(--branco)}

.topo-acoes{display:flex;align-items:center;gap:8px;margin-left:auto}
.topo-proc{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 12px;
  border:1px solid var(--risco);border-radius:999px;text-decoration:none;
  color:var(--mudo);font-size:14px;background:var(--branco)}
.topo-proc:hover{border-color:var(--tinta-f);color:var(--tinta)}
.topo-proc svg{width:15px;height:15px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round}
.botao-p{min-height:38px;padding:0 16px;font-size:14px;border-radius:8px}

/* a gaveta de ecra pequeno */
.hamb{display:none;width:40px;height:38px;border:1px solid var(--risco);
  border-radius:8px;background:var(--branco);cursor:pointer;
  flex-direction:column;align-items:center;justify-content:center;gap:4px}
.hamb span{display:block;width:17px;height:2px;background:var(--tinta);
  border-radius:2px;transition:transform .2s, opacity .2s}
.hamb[aria-expanded="true"] span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.hamb[aria-expanded="true"] span:nth-child(2){opacity:0}
.hamb[aria-expanded="true"] span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.men-movel{display:none;border-top:1px solid var(--risco);
  background:var(--branco);padding:var(--e3) 0}
.men-movel[hidden]{display:none !important}
.men-m-proc{display:flex;align-items:center;gap:10px;padding:13px 15px;
  border:1px solid var(--risco);border-radius:10px;text-decoration:none;
  color:var(--mudo);margin:0 0 var(--e3);font-size:15px}
.men-m-proc svg{width:17px;height:17px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round}
.men-l{display:grid;gap:2px;margin-top:var(--e3);
  border-top:1px solid var(--risco);padding-top:var(--e2)}
.men-l a{padding:11px;border-radius:7px;text-decoration:none;
  color:var(--tinta);font-weight:500}
.men-l a:hover{background:var(--papel)}

@media (max-width:980px){
  .nav,.topo-proc{display:none}
  .hamb{display:flex}
  .men-movel{display:block}
}
@media (max-width:520px){
  .botao-p{display:none}
}

/* ---------------------------------------------------------- as bandas
   O site deixa de ser uma folha branca com coisas em cima. Alterna
   bandas de cor a toda a largura, e e isso que da ritmo a pagina quando
   se percorre. */
.banda{background:var(--papel)}
.banda-b{background:var(--branco);border-top:1px solid var(--risco);
  border-bottom:1px solid var(--risco)}
.banda-e{background:var(--tinta);color:rgba(255,255,255,.86)}
.banda-e h1,.banda-e h2,.banda-e h3{color:var(--branco)}
.banda-e .rot{color:rgba(255,255,255,.6)}
.banda-e .rot b{color:var(--cor-clara)}
.banda-e .rot::after{background:rgba(255,255,255,.18)}

/* ------------------------------------------------------- o detalhe fino
   O Ricardo pediu mais detalhe decorativo. Nao e enfeite solto: e um
   sistema pequeno que se repete em todas as paginas e faz o site parecer
   um instrumento em vez de uma brochura — rotulos numerados, filetes,
   cantos marcados, numeros de largura fixa. */

/* o rotulo numerado de uma seccao: "01 / THE DAY" */
.rot{display:flex;align-items:center;gap:10px;margin:0 0 var(--e2);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mudo);font-weight:600}
.rot b{font-family:var(--mono);font-weight:600;color:var(--cor-escura);
  font-size:11px;letter-spacing:.06em}
.rot::after{content:'';flex:1;height:1px;background:var(--risco)}

/* numeros sempre de largura fixa: precos, horas, coordenadas */
.num,.preco,time,[data-num]{font-variant-numeric:tabular-nums}

/* a moldura com os cantos marcados, para blocos que tem de pesar */
.moldura{position:relative;border:1px solid var(--risco);
  border-radius:var(--raio);background:var(--branco)}
.moldura::before,.moldura::after{content:'';position:absolute;width:9px;
  height:9px;border:2px solid var(--cor);pointer-events:none}
.moldura::before{top:-1px;left:-1px;border-right:0;border-bottom:0;
  border-radius:var(--raio) 0 0 0}
.moldura::after{bottom:-1px;right:-1px;border-left:0;border-top:0;
  border-radius:0 0 var(--raio) 0}

/* um codigo: IATA, coordenada, referencia */
.cod{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;
  color:var(--mudo);background:var(--papel);border:1px solid var(--risco);
  border-radius:4px;padding:2px 6px}

/* a revelacao ao percorrer. Quem pediu para nao haver movimento nao tem
   movimento nenhum — e a regra esta primeiro, para nunca ser esquecida. */
@media (prefers-reduced-motion:no-preference){
  [data-rev]{opacity:0;transform:translateY(14px);
    transition:opacity .5s cubic-bezier(.2,.6,.2,1),
               transform .5s cubic-bezier(.2,.6,.2,1)}
  [data-rev].vis{opacity:1;transform:none}
}

/* os cartoes de tour: o cartao e desenhado em pagina.cartao_tour(), por
   isso o CSS dele tem de estar aqui tambem. Esteve so na homepage e na
   pagina de resultados os cartoes sairam como texto corrido. */
/* tours */
/* mais cartoes por ecra: a 1440 cabem quatro, nao tres */
.tours{display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,268px),1fr))}
.tour{display:flex;flex-direction:column;text-decoration:none;
  border:1px solid var(--risco);border-radius:var(--raio);overflow:hidden;
  background:var(--branco);transition:border-color .18s, transform .18s}
.tour:hover{border-color:var(--tinta-f);transform:translateY(-2px)}
.tour-foto{position:relative;aspect-ratio:16/10;background:var(--uma-f);
  display:block;overflow:hidden}
.tour-foto img{width:100%;height:100%;object-fit:cover;
  transition:transform .5s ease}
.tour:hover .tour-foto img{transform:scale(1.045)}
.credito{position:absolute;right:7px;bottom:6px;z-index:2;font-size:10px;
  color:#fff;background:rgba(11,43,42,.62);padding:2px 6px;border-radius:4px}
/* a duracao em cima da fotografia: le-se antes do titulo, que e a ordem
   por que as pessoas decidem */
.tour-sel{position:absolute;left:7px;top:7px;z-index:2;font-family:var(--mono);
  font-size:11px;letter-spacing:.03em;color:var(--tinta);background:var(--branco);
  padding:3px 8px;border-radius:4px;font-variant-numeric:tabular-nums}
.tour-corpo{display:flex;flex-direction:column;gap:7px;padding:14px 15px 15px;
  flex:1}
.tour-onde{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--cor-escura);font-weight:600}
.tour-onde .pt{color:var(--risco)}
.tour-nome{font-family:var(--tipo-titulo);font-weight:600;font-size:1.02rem;
  color:var(--tinta);line-height:1.2}
.tour-linha{display:flex;flex-wrap:wrap;gap:5px;margin-top:1px}
.etiq{font-size:11.5px;color:var(--texto);background:var(--papel);
  border:1px solid var(--risco);border-radius:4px;padding:2px 7px}
.tour-preco{margin-top:auto;padding-top:11px;border-top:1px solid var(--risco);
  display:flex;align-items:flex-end;gap:9px;justify-content:space-between}
.tour-preco b{font-family:var(--tipo-titulo);font-size:1.22rem;
  color:var(--tinta);line-height:1}
.tour-preco-nota{font-size:11.5px;color:var(--mudo);text-align:right;
  line-height:1.35}

/* rodape */
.rodape{background:var(--papel);border-top:1px solid var(--risco);
  padding:var(--e5) 0 var(--e4);margin-top:0}
.rodape-i{display:flex;gap:40px;flex-wrap:wrap;justify-content:space-between}
.rodape .marca{color:var(--tinta)}
.rodape-nota{color:var(--mudo);font-size:14px;max-width:40ch;margin:16px 0 0}
.rodape-cols{display:flex;gap:56px;flex-wrap:wrap}
.rodape-col h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--mudo);font-family:var(--tipo);font-weight:600;margin:0 0 12px}
.rodape-col a{display:block;text-decoration:none;color:var(--texto);
  font-size:15px;padding:4px 0}
.rodape-col a:hover{color:var(--cor-escura)}
.rodape-fim{margin-top:40px;padding-top:22px;border-top:1px solid var(--risco);
  font-size:13.5px;color:var(--mudo);display:flex;gap:18px;flex-wrap:wrap;
  justify-content:space-between}

.marca{font-size:var(--t);line-height:1;display:inline-flex;align-items:center;
  gap:.6em;text-decoration:none}
.marca .sim{width:1em;height:1em;flex:none;display:block}
.marca-nome{display:inline-flex;flex-direction:column;align-items:flex-start;
  font-family:var(--tipo-titulo);font-weight:600;text-transform:uppercase;
  color:var(--tinta);line-height:1;white-space:nowrap;margin:0}
.marca-nome-h1{font-size:inherit}
.marca-l1{font-size:.268em;letter-spacing:.075em;margin-right:-.075em}
.marca-l2{font-size:.268em;letter-spacing:.2165em;margin-right:-.2165em;
  margin-top:.19em}
/* os planos: nenhum gradiente, so cores cheias que tapam o que esta atras */
.sim .papel{fill:var(--papel)}
.sim .p{fill:var(--tinta)}
.sim .pf{fill:var(--tinta-f)}
.sim .c{fill:var(--cor)}
.sim .u{fill:var(--tinta)}
.sim .u-f{fill:var(--uma-f)}

.pc{position:relative;width:100%}
.pc-caixa{display:flex;align-items:center;gap:12px;background:var(--branco);
  border-radius:14px;padding:8px 8px 8px 20px;
  box-shadow:0 18px 46px -22px rgba(11,43,42,.55)}
.pc-lupa{width:21px;height:21px;flex:none;fill:none;stroke:var(--mudo);
  stroke-width:2;stroke-linecap:round}
.pc-caixa input{flex:1;min-width:0;border:0;padding:16px 0;font:inherit;
  font-size:17px;color:var(--tinta);background:transparent}
.pc-caixa input::placeholder{color:var(--mudo)}
.pc-caixa input:focus{outline:0}
.pc-caixa:focus-within{box-shadow:0 0 0 3px var(--cor),
  0 18px 46px -22px rgba(11,43,42,.55)}
.pc-botao{min-height:52px}
.pc-oculto{position:absolute;width:1px;height:1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;margin:0}

.pc-lista{position:absolute;z-index:50;left:0;right:0;top:calc(100% + 10px);
  padding:8px;background:var(--branco);border:1px solid var(--risco);
  border-radius:14px;max-height:400px;overflow:auto;
  box-shadow:0 24px 54px -26px rgba(11,43,42,.5);text-align:left}
.pc-lista[hidden]{display:none}
.pc-grupo{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mudo);font-weight:600;padding:12px 12px 6px}
.pc-grupo:first-child{padding-top:6px}
.pc-op{display:flex;align-items:center;gap:12px;padding:10px 12px;
  border-radius:9px;cursor:pointer;color:var(--texto);font-size:15px}
.pc-op[aria-selected="true"],.pc-op:hover{background:var(--papel)}
.pc-icone{width:34px;height:34px;flex:none;border-radius:9px;
  background:var(--papel);display:grid;place-items:center;color:var(--tinta)}
.pc-op[aria-selected="true"] .pc-icone{background:var(--branco)}
.pc-icone svg{width:17px;height:17px;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pc-txt{min-width:0;flex:1}
.pc-t1{display:block;color:var(--tinta);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-t2{display:block;color:var(--mudo);font-size:13px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-n{flex:none;font-size:12px;font-weight:600;color:var(--branco);
  background:var(--cor-escura);border-radius:999px;padding:3px 10px}
.pc-nada{flex:none;font-size:12.5px;color:var(--mudo)}
.pc-vazio{padding:16px 12px 18px;color:var(--mudo);font-size:14.5px}
.pc-vazio b{color:var(--tinta)}
@media (max-width:700px){
  .pc-caixa{flex-wrap:wrap;padding:8px}
  .pc-caixa input{flex:1 1 100%;padding:12px 8px}
  .pc-lupa{display:none}
  .pc-botao{flex:1 1 100%}
}


/* =================================================================
   AS FICHAS

   Ver tools/tema.py. Nao se escreve uma cor a mao numa folha de
   estilo deste projecto: escreve-se o nome de uma ficha. Uma cor
   escrita a mao e uma cor que nao muda quando o tema muda.
   ================================================================= */
:root {
  --papel: #FAFAF9;
  --sup: #FFFFFF;
  --sup-2: #F2F3F2;
  --sup-3: #E9EBEA;
  --tinta: #10312E;
  --tinta-2: #3D524F;
  --mudo: #586966;
  --acento: #A4501E;
  --acento-f: #FBEFE7;
  --fechado: #98422C;
  --fechado-f: #FBECE8;
  --bom: #1F6B4F;
  --bom-f: #E8F3ED;
  --sel: #10312E;
  --sel-t: #FAFAF9;
  --sombra: 0 1px 2px rgba(16,49,46,.04), 0 8px 24px -12px rgba(16,49,46,.10);
  --r-xg: 28px;
  --r-g: 22px;
  --r-m: 14px;
  --r-p: 10px;
  --r-c: 999px;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
  --papel: #0C1413;
  --sup: #14201E;
  --sup-2: #1B2927;
  --sup-3: #243331;
  --tinta: #EAF1EF;
  --tinta-2: #B8C8C5;
  --mudo: #8C9F9C;
  --acento: #E88B4F;
  --acento-f: #2B1D14;
  --fechado: #E8907A;
  --fechado-f: #2C1A17;
  --bom: #6FC79B;
  --bom-f: #12241C;
  --sel: #2A4741;
  --sel-t: #EAF1EF;
  --sombra: none;
  }
}

:root[data-tema="escuro"] {
  --papel: #0C1413;
  --sup: #14201E;
  --sup-2: #1B2927;
  --sup-3: #243331;
  --tinta: #EAF1EF;
  --tinta-2: #B8C8C5;
  --mudo: #8C9F9C;
  --acento: #E88B4F;
  --acento-f: #2B1D14;
  --fechado: #E8907A;
  --fechado-f: #2C1A17;
  --bom: #6FC79B;
  --bom-f: #12241C;
  --sel: #2A4741;
  --sel-t: #EAF1EF;
  --sombra: none;
}

/* ------------------------------------------------------------ base */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--papel);
  color: var(--tinta);
  /* Os numeros das tabelas e do calendario tem de alinhar em coluna.
     Era para isso que a primeira versao usava monoespacada — mas isso
     traz o aspecto de terminal com ele. `tnum` faz o trabalho e deixa
     o texto normal. */
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; }

button {
  color: inherit; border: 0; background: none; cursor: pointer;
}

/* O foco e visivel em TODO o projecto, e e a mesma forma em todo o
   projecto. Quem navega por teclado nao devia ter de aprender duas
   linguagens entre o site e o portal. */
:focus-visible {
  outline: 2px solid var(--acento);
  outline-offset: 3px;
  border-radius: 6px;
}

/* Quem pediu menos movimento recebe menos movimento. Nao e uma
   gentileza: para algumas pessoas a animacao causa mal-estar fisico. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
}

:root {
  --tinta-topo: #0B2B2A;
  --papel-topo: #F6F4F1;
}

/* ----------------------------------------------------- o interruptor */
.tm {
  display: inline-flex; align-items: center; gap: .45rem;
  padding: .4rem .85rem .4rem .7rem;
  border-radius: var(--r-c);
  background: var(--sup-2); color: var(--tinta-2);
  font-size: .8rem; font-weight: 600; letter-spacing: .01em;
  transition: background .15s, color .15s;
}
.tm:hover { background: var(--sup-3); color: var(--tinta); }
.tm-i {
  width: 14px; height: 14px; border-radius: var(--r-c);
  background: var(--tinta-2);
  /* O icone e um circulo com uma mordida: cheio = escuro, vazio =
     claro, meio = automatico. Nao e um sol nem uma lua porque um sol
     e uma lua lado a lado perguntam "qual e o estado actual?" e esta
     forma responde. */
  box-shadow: inset -4px 0 0 0 var(--sup-2);
}
:root[data-tema="claro"] .tm-i { box-shadow: inset -9px 0 0 0 var(--sup-2); }
:root[data-tema="escuro"] .tm-i { box-shadow: none; }

/* ------------------------------------------------------------ portal */
body.pt {
  background: var(--papel);
  font: 400 15px/1.5 'Inter', system-ui, -apple-system, sans-serif;
  color: var(--tinta);
}

/* ---------------------------------------------------------- o topo
   Uma barra so, sem a segunda barra de navegacao por baixo. Eram duas
   faixas a roubar 110px de altura antes de comecar o conteudo, no
   ecra onde ha menos altura para dar. */
.pt-topo {
  background: var(--tinta-topo); color: var(--papel-topo);
  position: sticky; top: 0; z-index: 40;
  /* as tintas de fundo escuro, para a marca aqui dentro */
  --papel: #0B1715; --tinta: #F3F1EE; --cor: #CE7030;
  --tinta-f: #515856; --cor-f: #704523; --uma-f: #47504D;
}
/* O fundo do topo e o verde da marca e nao o quase-preto do palco
   escuro, por isso a capa do passaporte leva a cor do papel claro: e
   assim que ela se destaca, como se destaca no papel. */
.pt-topo .sim .p { fill: var(--papel-topo); }
.pt-topo .sim .pf { fill: #704523; }
.pt-topo .sim .papel { fill: var(--tinta-topo); }
.pt-topo .sim .u { fill: var(--papel-topo); }
.pt-topo .marca-nome { color: var(--papel-topo); }
.pt-topo-i {
  display: flex; align-items: center; gap: .6rem 1rem;
  min-height: 62px; padding: .55rem 0;
  /* Dobra. Sem isto, a marca mais a etiqueta mais o email mais o botao
     de sair somavam 525px num ecra de 390 e a pagina toda rolava para o
     lado — no sitio onde o operador a vai mesmo abrir. */
  flex-wrap: wrap;
}
.pt-topo .marca { flex: 0 0 auto; }

/* A etiqueta era maiuscula, espacada e com moldura. Agora e uma
   pastilha de fundo translucido: diz a mesma coisa e nao grita. */
.pt-etiq {
  font-size: .76rem; font-weight: 600;
  color: var(--papel-topo); background: rgba(255,255,255,.14);
  padding: .3rem .7rem; border-radius: var(--r-c);
  white-space: nowrap;
}
.pt-topo-fim {
  margin-left: auto; display: flex; align-items: center; gap: .6rem;
  min-width: 0;
}
.pt-quem {
  font-size: .82rem; color: var(--papel-topo); opacity: .8;
  text-align: right; max-width: 14rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0;
}
/* Em ecra estreito o email e a primeira coisa a sair: quem esta a usar o
   telemovel sabe de quem e o telemovel. O botao de sair fica. */
@media (max-width: 620px) {
  .pt-quem { display: none; }
  .pt-topo-i { min-height: 56px; }
  .pt-etiq { font-size: .7rem; padding: .26rem .55rem; }
}
.pt-sair {
  font-size: .84rem; font-weight: 500;
  color: var(--papel-topo); background: rgba(255,255,255,.14);
  border-radius: var(--r-c); padding: .48rem .9rem;
}
.pt-sair:hover { background: rgba(255,255,255,.26); }

/* O interruptor de tema, dentro do topo: o topo e escuro nos dois
   temas, por isso o botao aqui nao pode usar as fichas de superficie. */
.pt-topo .tm {
  background: rgba(255,255,255,.14); color: var(--papel-topo);
}
.pt-topo .tm:hover { background: rgba(255,255,255,.26); }
.pt-topo .tm-i {
  background: var(--papel-topo);
  box-shadow: inset -4px 0 0 0 #F3F1EE;
}
:root[data-tema="claro"] .pt-topo .tm-i {
  box-shadow: inset -9px 0 0 0 #F3F1EE;
}
:root[data-tema="escuro"] .pt-topo .tm-i { box-shadow: none; }

/* ------------------------------------------------- a navegacao
   Pastilhas numa fita que rola, e nao separadores com um risco por
   baixo. A pastilha activa e cheia: ve-se de relance qual e, que e a
   unica pergunta que uma navegacao tem de responder. */
.pt-nav {
  background: var(--papel);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.pt-nav::-webkit-scrollbar { display: none; }
.pt-nav-i { display: flex; gap: .3rem; padding: .7rem 0 .2rem; }
.pt-nav a {
  font-size: .89rem; font-weight: 500;
  color: var(--tinta-2); text-decoration: none;
  padding: .55rem .95rem; border-radius: var(--r-c);
  white-space: nowrap; transition: background .15s, color .15s;
}
.pt-nav a:hover { background: var(--sup-2); color: var(--tinta); }
.pt-nav a[aria-current="page"] {
  background: var(--sel); color: var(--sel-t); font-weight: 600;
}

.pt-corpo { padding: 1.5rem 0 5rem; }
.pt-cab { margin-bottom: 1.5rem; }
.pt-cab h1 {
  font-size: clamp(1.5rem, 3.4vw, 2.05rem); font-weight: 700;
  line-height: 1.12; letter-spacing: -.02em;
  color: var(--tinta); margin: 0 0 .35rem;
}
.pt-cab p {
  font-size: .96rem; line-height: 1.55;
  color: var(--mudo); margin: 0; max-width: 58ch;
}

/* ------------------------------------------------------------ cartoes */
.cx {
  background: var(--sup); border-radius: var(--r-g);
  padding: 1.4rem; margin-bottom: 1rem;
  box-shadow: var(--sombra);
}
/* O titulo do cartao era maiusculo, espacado e com um risco por baixo.
   Agora e so uma linha mais forte com espaco a seguir — o espaco separa
   tao bem como o risco e nao acrescenta nada ao ecra. */
.cx-t {
  font-size: .95rem; font-weight: 600; letter-spacing: -.01em;
  color: var(--tinta); margin: 0 0 1rem;
}
.cx-v { display: grid; gap: 1.1rem; }
@media (min-width: 900px) { .cx-2 { grid-template-columns: 1fr 1fr; } }

/* Visivel para um leitor de ecra, invisivel para o olho. Serve as listas
   onde repetir o rotulo cinco vezes seria ruido, mas onde um campo sem
   rotulo nenhum e um campo que ninguem consegue usar as cegas. */
.so-leitor {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* --------------------------------------------------------- formulario */
.campo { margin-bottom: 1.1rem; }
.campo > label, .campo > .rot {
  display: block; margin-bottom: .4rem;
  font-size: .85rem; font-weight: 600; color: var(--tinta);
}
.campo .ajuda {
  display: block; margin-top: .35rem;
  font-size: .8rem; line-height: 1.45; color: var(--mudo);
}
/* Os campos nao levam moldura: levam uma superficie afundada. E a
   mesma leitura — "aqui escreve-se" — com menos tracos no ecra. A
   moldura so aparece no foco e no erro, que e quando ela informa. */
input[type=text], input[type=email], input[type=tel], input[type=url],
input[type=number], input[type=date], input[type=time], input[type=password],
select, textarea {
  width: 100%; box-sizing: border-box;
  font-size: .96rem; line-height: 1.4; color: var(--tinta);
  background: var(--sup-2); border: 0; border-radius: var(--r-m);
  padding: .78rem .85rem;
  transition: background .15s, box-shadow .15s;
}
input::placeholder, textarea::placeholder { color: var(--mudo); }
input:hover, select:hover, textarea:hover { background: var(--sup-3); }
input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 0; background: var(--sup);
  box-shadow: 0 0 0 2px var(--acento);
}
input[aria-invalid="true"], textarea[aria-invalid="true"] {
  box-shadow: 0 0 0 2px var(--fechado); background: var(--fechado-f);
}
textarea { min-height: 7rem; resize: vertical; }
.linha2 { display: grid; gap: 1rem; }
@media (min-width: 620px) { .linha2 { grid-template-columns: 1fr 1fr; } }
fieldset { border: 0; padding: 0; margin: 0 0 1.2rem; }
legend {
  padding: 0; margin-bottom: .7rem;
  font-size: 1.05rem; font-weight: 700; letter-spacing: -.015em;
  color: var(--tinta);
}
.obrig { color: var(--fechado); }

/* --------------------------------------------------- linhas repetiveis
   Uma lista onde se acrescentam e apagam linhas: escaloes de preco,
   paragens, perguntas, fotografias. Vive aqui e nao no editor porque
   mais do que uma pagina do portal a usa. */
.rep { display: grid; gap: .7rem; }
.rep-l {
  display: grid; gap: .6rem; align-items: start;
  padding: 1rem; border-radius: var(--r-m);
  background: var(--sup-2);
}
.rep-l > .campo { margin: 0; }
.rep-l input, .rep-l select, .rep-l textarea { background: var(--sup); }
.rep-l input:hover, .rep-l select:hover { background: var(--sup-3); }
.rep-x {
  justify-self: start;
  font-size: .82rem; font-weight: 600;
  color: var(--fechado); background: var(--fechado-f);
  border-radius: var(--r-c); padding: .48rem .85rem;
}
.rep-x:hover { filter: brightness(.96); }
/* O "acrescentar" era um retangulo tracejado. O tracejado diz
   "provisorio", e acrescentar uma linha nao e provisorio. */
.rep-mais {
  justify-self: start; margin-top: .3rem;
  font-size: .87rem; font-weight: 600;
  color: var(--tinta); background: var(--sup-2);
  border-radius: var(--r-c); padding: .6rem 1rem;
}
.rep-mais:hover { background: var(--sup-3); }

/* Os tours ligados a um recurso (um veiculo, um ponto de encontro). */
.v-tours { display: grid; gap: .4rem; margin-top: .3rem; }
.v-t {
  display: flex; align-items: flex-start; gap: .6rem;
  font-size: .9rem; line-height: 1.45; color: var(--tinta-2);
  padding: .6rem .7rem; border-radius: var(--r-p); background: var(--sup-2);
  cursor: pointer;
}
.v-t:hover { background: var(--sup-3); }
.v-t input {
  margin: .15rem 0 0; width: 1.1rem; height: 1.1rem; flex: none;
  accent-color: var(--acento);
}
.v-t span span { color: var(--mudo); }

/* ------------------------------------------------------------- avisos
   Sem a barra de 4px a esquerda: a cor do fundo ja diz de que tipo e o
   aviso, e a barra era uma segunda vez a dizer o mesmo. */
.aviso {
  margin: 1rem 0; padding: .9rem 1.05rem; border-radius: var(--r-m);
  font-size: .91rem; line-height: 1.55;
  background: var(--sup-2); color: var(--tinta-2);
}
.aviso-mal  { background: var(--fechado-f); color: var(--fechado); }
.aviso-bem  { background: var(--bom-f);     color: var(--bom); }
.aviso-nota { background: var(--acento-f);  color: var(--acento); }
.aviso strong { color: inherit; }

/* ------------------------------------------------------------ estados */
.est {
  display: inline-block; vertical-align: middle;
  font-size: .76rem; font-weight: 600;
  padding: .26rem .65rem; border-radius: var(--r-c); white-space: nowrap;
}
.est-pending  { background: var(--acento-f);  color: var(--acento); }
.est-approved { background: var(--bom-f);     color: var(--bom); }
.est-live     { background: var(--bom-f);     color: var(--bom); }
.est-rejected { background: var(--fechado-f); color: var(--fechado); }
.est-draft    { background: var(--sup-2);     color: var(--mudo); }
.est-paused   { background: var(--sup-2);     color: var(--mudo); }
.est-new      { background: var(--acento-f);  color: var(--acento); }

/* ------------------------------------------------------------ tabelas */
.tab-rolo { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tab-rolo:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
table.tab { width: 100%; border-collapse: collapse; }
table.tab th, table.tab td {
  text-align: left; padding: .85rem .9rem; vertical-align: top;
  font-size: .91rem; line-height: 1.45; color: var(--tinta-2);
}
/* O cabecalho da tabela era maiusculo e espacado com um risco de 2px.
   Agora e texto normal mais claro, e a linha que separa e a propria
   mudanca de fundo das linhas abaixo. */
table.tab th {
  font-size: .8rem; font-weight: 600; color: var(--mudo);
  white-space: nowrap; padding-bottom: .5rem;
}
table.tab tbody tr { background: var(--sup); }
table.tab tbody tr:nth-child(even) { background: var(--sup-2); }
table.tab tbody tr:first-child td:first-child { border-top-left-radius: var(--r-m); }
table.tab tbody tr:first-child td:last-child { border-top-right-radius: var(--r-m); }
table.tab tbody tr:last-child td:first-child { border-bottom-left-radius: var(--r-m); }
table.tab tbody tr:last-child td:last-child { border-bottom-right-radius: var(--r-m); }
table.tab a { color: var(--acento); font-weight: 500; }

/* -------------------------------------------------------------- vazio
   O retangulo tracejado sai. Um ecra vazio nao e um erro nem um
   espaco por preencher: e um estado normal no primeiro dia de uso. */
.vazio {
  padding: 2.6rem 1.4rem; text-align: center;
  border-radius: var(--r-g); background: var(--sup-2);
}
.vazio h3 {
  font-size: 1.1rem; font-weight: 700; letter-spacing: -.015em;
  color: var(--tinta); margin: 0 0 .45rem;
}
.vazio p {
  font-size: .94rem; line-height: 1.55;
  color: var(--mudo); margin: 0 auto 1.2rem; max-width: 44ch;
}

/* -------------------------------------------------------------- acoes */
.acoes { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.bt {
  font-size: .93rem; font-weight: 600;
  padding: .78rem 1.3rem; border-radius: var(--r-c); border: 0;
  cursor: pointer; text-decoration: none; display: inline-block;
  transition: background .15s, filter .15s;
}
.bt-p { background: var(--sel); color: var(--sel-t); }
.bt-p:hover { filter: brightness(1.12); }
.bt-s { background: var(--sup-2); color: var(--tinta); }
.bt-s:hover { background: var(--sup-3); }
.bt-mal { background: var(--fechado-f); color: var(--fechado); }
.bt-mal:hover { filter: brightness(.96); }
.bt[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
.bt-pq { font-size: .84rem; padding: .52rem .9rem; }

/* --------------------------------------------------------- a carregar */
.carrega {
  padding: 2.5rem 0; text-align: center;
  font-size: .93rem; color: var(--mudo);
}

.ops-f { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: 1.1rem; }
.ops-f button {
  font: 500 .85rem/1 'Inter', system-ui, sans-serif;
  background: var(--sup); border: 1px solid var(--mudo); border-radius: 20px;
  color: var(--tinta-2); padding: .5rem .9rem; cursor: pointer;
}
.ops-f button[aria-pressed="true"] {
  background: var(--tinta); color: var(--papel); border-color: var(--tinta);
}
.com-in { width: 5.5rem; }
.barra {
  height: .5rem; border-radius: 3px; background: var(--acento); min-width: 3px;
}
.barra-f { background: var(--sup-3); border-radius: 3px; }
.proc-q { font-weight: 600; color: var(--tinta); }
.nada { font-style: italic; color: var(--mudo); }

      .select('*, listings(id, status)').order('created_at', { ascending: false });

    c.innerHTML = '<div class="tab-rolo" tabindex="0" role="region" '
      + 'aria-label="Table, scrolls sideways"><table class="tab">'
      + '<thead><tr><th>Operator</th><th>Where</th><th>Status</th>'
      + '<th>Tours</th><th>Commission</th><th></th></tr></thead><tbody>'
      + os.map(function (o) {
          var vivos = (o.listings || []).filter(function (l) {
            return l.status === 'live'; }).length;
          return '<tr data-o="' + o.id + '">'
            + '<td><b>' + ewt.escapar(o.name) + '</b><br>'
            + '<a href="mailto:' + ewt.escapar(o.email) + '">'
            + ewt.escapar(o.email) + '</a></td>'
            + '<td>' + ewt.escapar(o.city) + '<br>'
            + ewt.escapar(o.country) + '</td>'
            + '<td><span class="est est-' + o.status + '">' + o.status
            + '</span></td>'
            + '<td>' + vivos + ' live<br>' + (o.listings || []).length
            + ' total</td>'
            + '<td><input type="number" class="com-in" min="0" max="50" '
            + 'step="0.5" value="' + (Number(o.commission_rate) * 100)
            + '" data-com="' + o.id + '" aria-label="Commission percent for '
            + ewt.escapar(o.name) + '">%</td>'
            + '<td><div class="acoes">'
            + (o.status !== 'approved'
                ? '<button type="button" class="bt bt-s bt-pq" data-est="approved" '
                  + 'data-id="' + o.id + '">Approve</button>' : '')
            + (o.status !== 'suspended'
                ? '<button type="button" class="bt bt-mal bt-pq" data-est="suspended" '
                  + 'data-id="' + o.id + '">Suspend</button>' : '')
            + '</div></td></tr>';
        }).join('')
      + '</tbody></table></div>'
      + '<p class="aviso" id="av-ops" role="status" hidden></p>'
      + '<p class="lado-nota" style="margin-top:1rem">Suspending an '
      + 'operator takes their tours off the site immediately &mdash; the '
      + 'public view requires the operator to be approved. It does not '
      + 'delete anything.</p>';
  }

  async function mudarEstado(id, estado) {
    var campos = { status: estado };
    if (estado === 'approved') campos.approved_at = new Date().toISOString();
    var r = await ewt.sb.from('operators').update(campos).eq('id', id);
    if (r.error) { ewt.dizer('av-ops', ewt.legivel(r.error), 'mal'); return; }
    ewt.dizer('av-ops', 'Status changed.', 'bem');
    desenhar();
  }

  async function mudarComissao(id, pct) {
    var v = Number(pct);
    // A base recusa fora de 0–50%, mas dizer antes poupa uma mensagem
    // tecnica a quem se enganou a escrever.
    if (!isFinite(v) || v < 0 || v > 50) {
      ewt.dizer('av-ops', 'Commission has to be between 0 and 50 per cent.',
        'mal');
      return;
    }
    var r = await ewt.sb.from('operators')
      .update({ commission_rate: v / 100 }).eq('id', id);
    if (r.error) { ewt.dizer('av-ops', ewt.legivel(r.error), 'mal'); return; }
    ewt.dizer('av-ops', 'Commission for that operator is now ' + v + '%. '
      + 'It applies to what they are paid, from now on.', 'bem');
  }

  (async function () {
    var p = await ewt.exigir_entrada();
    if (!p) return;
    document.getElementById('carrega').hidden = true;
    if (!p.admin) {
      document.getElementById('conteudo').innerHTML =
        '<div class="vazio"><h3>This area is not yours</h3>'
        + '<a class="bt bt-p" href="/portal/">Go to the operator portal</a></div>';
      return;
    }
    document.getElementById('ad').hidden = false;

    document.getElementById('filtros').addEventListener('click', function (ev) {
      var b = ev.target.closest('button[data-f]');
      if (!b) return;
      FILTRO = b.getAttribute('data-f');
      [].slice.call(ev.currentTarget.querySelectorAll('button'))
        .forEach(function (x) {
          x.setAttribute('aria-pressed',
            x.getAttribute('data-f') === FILTRO ? 'true' : 'false');
        });
      desenhar();
    });

    var lista = document.getElementById('lista');
    lista.addEventListener('click', function (ev) {
      var b = ev.target.closest('button[data-est]');
      if (b) mudarEstado(b.getAttribute('data-id'), b.getAttribute('data-est'));
    });
    // A comissao grava-se ao sair do campo e nao a cada tecla: gravar a
    // cada tecla escrevia "2", "20", "205" na base pelo caminho.
    lista.addEventListener('change', function (ev) {
      var i = ev.target.closest('[data-com]');
      if (i) mudarComissao(i.getAttribute('data-com'), i.value);
    });

    await desenhar();
  })();
})();

(function () {
  // O email e o botao de sair, iguais em todas as paginas do portal.
  if (!window.ewt || window.ewt.avariado) {
    var c = document.getElementById('conteudo');
    if (c) {
      c.innerHTML = '<div class="aviso aviso-mal">The portal could not '
        + 'load. Reload the page; if it keeps happening, write to us.</div>';
    }
    return;
  }
  var b = document.getElementById('sair');
  if (b) {
    b.addEventListener('click', function () { ewt.sair(); });
  }
  ewt.utilizador().then(function (u) {
    var q = document.getElementById('quem');
    if (u && q) { q.textContent = u.email; }
    if (u && b) { b.hidden = false; }
    // A navegacao do portal leva a paginas que exigem sessao. Mostra-la
    // a quem ainda nao entrou era oferecer quatro ligacoes que todas
    // devolvem a pessoa a esta mesma pagina.
    var nav = document.querySelector('.pt-nav');
    if (nav && !u) { nav.hidden = true; }
  });
})();

(function () {
  // Os menus: um botao, um painel, e o estado todo no aria-expanded — que
  // e o que um leitor de ecra le. Escape fecha, clicar fora fecha, e o
  // foco volta ao botao, senao quem navega por teclado fica no limbo.
  var bs = [].slice.call(document.querySelectorAll('[data-menu]'));
  if (!bs.length) return;

  function fechar(b) {
    var p = document.getElementById(b.getAttribute('data-menu'));
    if (!p) return;
    p.hidden = true;
    b.setAttribute('aria-expanded', 'false');
  }
  function fecharTodos(excepto) {
    bs.forEach(function (b) { if (b !== excepto) fechar(b); });
  }

  bs.forEach(function (b) {
    var p = document.getElementById(b.getAttribute('data-menu'));
    if (!p) return;
    b.addEventListener('click', function () {
      var aberto = b.getAttribute('aria-expanded') === 'true';
      fecharTodos(b);
      p.hidden = aberto;
      b.setAttribute('aria-expanded', aberto ? 'false' : 'true');
    });
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    bs.forEach(function (b) {
      if (b.getAttribute('aria-expanded') === 'true') { fechar(b); b.focus(); }
    });
  });

  document.addEventListener('click', function (ev) {
    bs.forEach(function (b) {
      if (b.getAttribute('aria-expanded') !== 'true') return;
      var p = document.getElementById(b.getAttribute('data-menu'));
      if (!b.contains(ev.target) && p && !p.contains(ev.target)) fechar(b);
    });
  });
})();

(function () {
  // A revelacao ao percorrer. Quem tem 'reduzir movimento' ligado no
  // sistema nao ve nada disto: o conteudo aparece logo, inteiro.
  var q = window.matchMedia('(prefers-reduced-motion: reduce)');
  var alvos = [].slice.call(document.querySelectorAll('[data-rev]'));
  if (!alvos.length) return;
  if (q.matches || !('IntersectionObserver' in window)) {
    alvos.forEach(function (x) { x.classList.add('vis'); });
    return;
  }
  var obs = new IntersectionObserver(function (es) {
    es.forEach(function (en) {
      if (!en.isIntersecting) return;
      en.target.classList.add('vis');
      obs.unobserve(en.target);
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.04 });
  alvos.forEach(function (x) { obs.observe(x); });
})();
</script>

<script>
(function () {
  var ciclo = ['auto', 'claro', 'escuro'];
  var nomes = {auto: 'Auto', claro: 'Light', escuro: 'Dark'};
  var raiz = document.documentElement;

  function actual() {
    var a = raiz.getAttribute('data-tema');
    return (a === 'claro' || a === 'escuro') ? a : 'auto';
  }

  function por(v) {
    if (v === 'auto') {
      raiz.removeAttribute('data-tema');
      try { localStorage.removeItem('ewt-tema'); } catch (e) {}
    } else {
      raiz.setAttribute('data-tema', v);
      try { localStorage.setItem('ewt-tema', v); } catch (e) {}
    }
    Array.prototype.forEach.call(document.querySelectorAll('.tm'), function (b) {
      var t = b.querySelector('.tm-t');
      if (t) { t.textContent = nomes[v]; }
      b.setAttribute('aria-label', v === 'auto'
        ? 'Theme: follow system' : 'Theme: ' + nomes[v].toLowerCase());
    });
  }

  por(actual());

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest && ev.target.closest('.tm');
    if (!b) { return; }
    por(ciclo[(ciclo.indexOf(actual()) + 1) % ciclo.length]);
  });
})();
</script>
